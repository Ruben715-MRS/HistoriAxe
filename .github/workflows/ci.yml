name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests unitaires + validation des packs de données
        run: npm test

      - name: Build du bundle web (css/tailwind.generated.css + www/)
        run: npm run build
