name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests unitaires + validation des packs de données
        run: npm test

      - name: Build du bundle web (css/tailwind.generated.css + www/)
        run: npm run build

      # Étape distincte de `npm test` : elle ouvre un vrai navigateur sur le
      # site servi tel qu'il l'est en production, et couvre ce qu'aucun test
      # sans DOM ne voit — enchaînement des écrans, rendu, erreurs JS.
      - name: Navigateur pour les tests de bout en bout
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (Playwright)
        run: npm run test:e2e

      - name: Rapport des tests de bout en bout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
